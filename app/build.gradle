plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.jonlee.android.SJplayer'
    compileSdkVersion 36
    defaultConfig {
        applicationId 'com.jonlee.android.SJplayer'
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 93
        versionName "4.1.0"
        // Enabling multidex support.
        multiDexEnabled = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    sourceSets {
        main {
            res.srcDirs = ['../src/main/res']
            java.srcDirs = ['../src/main/java']
        }
    }

    compileOptions {
        sourceCompatibility = 11
        targetCompatibility = 11
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {

    // Add the support lib that is appropriate for SDK 18
    implementation 'junit:junit:4.13.2'
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'

    implementation 'com.google.api-client:google-api-client-android:2.2.0'

    //implementation 'com.google.android.gms:play-services:12.0.1'
    implementation('com.google.http-client:google-http-client-gson:1.39.2') {
        exclude module: 'httpclient'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev20251210-2.0.0') {
        exclude module: 'httpclient'
    }
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    //implementation 'com.google.android.gms:play-services:12.0.1'
    implementation 'com.google.android.gms:play-services-auth:20.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}
