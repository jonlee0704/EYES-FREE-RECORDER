plugins {
    id 'com.android.application' version '9.1.0' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
}

tasks.register('compileDebugSources') {
    dependsOn(':app:compileDebugSources')
}

tasks.register('compileDebugUnitTestSources') {
    dependsOn(':app:compileDebugUnitTestSources')
}

tasks.register('compileDebugAndroidTestSources') {
    dependsOn(':app:compileDebugAndroidTestSources')
}